name: OSM - diagnostico HTTP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostico:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    defaults:
      run:
        working-directory: back_end

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Testar diagnostico sem rede
        run: python -B tests/test_diagnostico_overpass.py

      - name: Comparar servidores e IPv4 sem banco
        env:
          OSM_OVERPASS_URLS: ""
        run: >-
          python -B scripts/diagnosticar_rede_overpass.py
          --saida "${{ runner.temp }}/osm-diagnostico-rede"

      - name: Guardar resultados de conectividade
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: osm-rede-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/osm-diagnostico-rede
          if-no-files-found: warn
          retention-days: 7