name: Diagnostico Overpass - sem banco

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: osm-diagnostico-overpass
  cancel-in-progress: false

jobs:
  diagnostico:
    runs-on: ubuntu-24.04
    timeout-minutes: 4

    steps:
      - name: Testar os dois servidores
        shell: python
        run: |
          import json
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          SERVIDORES = (
              "https://overpass-api.de/api/interpreter",
              "https://overpass.private.coffee/api/interpreter",
          )
          LIMITE = 1024 * 1024
          ERROS_CURL = {
              5: "dns_proxy",
              6: "dns_servidor",
              7: "conexao",
              28: "tempo_limite",
              35: "negociacao_tls",
              60: "certificado_tls",
              63: "resposta_maior_que_limite",
          }

          def testar(url):
              resultado = {"servidor": url, "mysql_consultado": False}

              with tempfile.TemporaryDirectory() as pasta:
                  corpo = Path(pasta) / "resposta.json"
                  comando = [
                      "curl", "--silent", "--show-error",
                      "--proto", "=https",
                      "--connect-timeout", "15",
                      "--max-time", "60",
                      "--max-filesize", str(LIMITE),
                      "--retry", "0",
                      "--header", "Accept: application/json",
                      "--user-agent",
                      "LitroDeOuro/1.1 (contact: litrodeourooficial@gmail.com)",
                      "--data-urlencode",
                      "data=[out:json][timeout:10];node(1);out ids;",
                      "--output", str(corpo),
                      "--write-out", "%{json}",
                      url,
                  ]

                  try:
                      execucao = subprocess.run(
                          comando, capture_output=True, text=True,
                          timeout=70, check=False,
                      )
                  except subprocess.TimeoutExpired:
                      return dict(resultado, status="tempo_limite_executor")
                  except OSError as erro:
                      return dict(
                          resultado, status="falha_executor",
                          tipo_erro=type(erro).__name__,
                      )

                  try:
                      info = json.loads(execucao.stdout)
                      if not isinstance(info, dict):
                          raise ValueError("Metadados invalidos.")
                  except ValueError:
                      return dict(
                          resultado, status="metadados_curl_invalidos",
                          codigo_curl=execucao.returncode,
                      )

                  resultado.update(
                      codigo_curl=execucao.returncode,
                      status_http=info.get("http_code") or None,
                      verificacao_tls=info.get("ssl_verify_result"),
                      tempos_s={
                          "dns": info.get("time_namelookup"),
                          "conexao_acumulado": info.get("time_connect"),
                          "tls_acumulado": info.get("time_appconnect"),
                          "total": info.get("time_total"),
                      },
                  )

                  if execucao.returncode:
                      return dict(
                          resultado, status="falha_transporte",
                          tipo_erro=ERROS_CURL.get(
                              execucao.returncode, "erro_curl",
                          ),
                      )

                  if resultado["status_http"] != 200:
                      return dict(resultado, status="falha_http")

                  try:
                      with corpo.open("rb") as arquivo:
                          bruto = arquivo.read(LIMITE + 1)
                      if len(bruto) > LIMITE:
                          raise ValueError("Resposta acima do limite.")
                      dados = json.loads(bruto)
                      if (
                          not isinstance(dados, dict)
                          or dados.get("remark")
                          or not isinstance(dados.get("elements"), list)
                      ):
                          raise ValueError("Resposta Overpass incompleta.")
                  except (ValueError, OSError) as erro:
                      return dict(
                          resultado, status="resposta_invalida",
                          tipo_erro=type(erro).__name__,
                      )

                  return dict(
                      resultado, status="ok",
                      total_elementos=len(dados["elements"]),
                  )

          resultados = []
          for servidor in SERVIDORES:
              resultado = testar(servidor)
              resultados.append(resultado)
              print(json.dumps(resultado, ensure_ascii=False, indent=2), flush=True)

          sucessos = sum(item["status"] == "ok" for item in resultados)
          resumo = {
              "status": "ok" if sucessos == 2 else "parcial" if sucessos else "falha",
              "servidores_disponiveis": sucessos,
              "mysql_consultado": False,
              "consulta_municipal_validada": False,
          }
          print(json.dumps(resumo, ensure_ascii=False, indent=2), flush=True)
          sys.exit(0 if sucessos else 1)