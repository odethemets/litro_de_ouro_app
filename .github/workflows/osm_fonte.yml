name: Fonte OSM - Joao Pessoa - sem banco

on:
  workflow_dispatch:
  workflow_call:
    outputs:
      sha256_fonte:
        description: SHA256 dos bytes validados da fonte municipal
        value: ${{ jobs.fonte.outputs.sha256_fonte }}
      artefato_fonte:
        description: Nome do artefato com a fonte municipal
        value: ${{ jobs.fonte.outputs.artefato_fonte }}

permissions: {}

concurrency:
  group: osm-fonte-joao-pessoa
  cancel-in-progress: false

jobs:
  fonte:
    runs-on: ubuntu-24.04
    timeout-minutes: 12

    outputs:
      sha256_fonte: ${{ steps.captura.outputs.sha256_fonte }}
      artefato_fonte: ${{ format('osm-fonte-{0}-{1}', github.run_id, github.run_attempt) }}

    steps:
      - name: Consultar e validar a fonte municipal
        id: captura
        shell: python
        run: |
          import hashlib
          import json
          import os
          import subprocess
          import sys
          from datetime import datetime, timezone
          from pathlib import Path

          URL = "https://overpass-api.de/api/interpreter"
          LIMITE = 16 * 1024 * 1024

          CONSULTA = (
              '[out:json][timeout:60];'
              'area["boundary"="administrative"]["admin_level"="8"]'
              '["IBGE:GEOCODIGO"="2507507"]->.municipio;'
              '.municipio out tags;('
              'nwr["amenity"="fuel"](area.municipio);'
              'nwr["amenity"="charging_station"](area.municipio);'
              ');out center tags;'
          )

          pasta = Path(os.environ["GITHUB_WORKSPACE"]) / "relatorios/osm-fonte"
          pasta.mkdir(parents=True, exist_ok=False)
          temporario = pasta / "resposta.tmp"

          relatorio = {
              "status": "iniciado",
              "etapa": "consultar_overpass",
              "servidor": URL,
              "mysql_consultado": False,
              "gravacao_banco_habilitada": False,
              "atribuicao": "© OpenStreetMap contributors — ODbL",
              "licenca_url": "https://www.openstreetmap.org/copyright",
          }
          codigo = 1

          def rejeitar_constante(valor):
              raise ValueError("Constante JSON invalida: " + valor)

          def validar_data_fonte(corpo, agora=None, servidor=None):
              from datetime import datetime, timezone
              momento = datetime.now(timezone.utc) if agora is None else agora
              meta = corpo.get("osm3s") if isinstance(corpo, dict) else None
              valor = meta.get("timestamp_osm_base") if isinstance(meta, dict) else None

              registro = {
                  "etapa": "diagnosticar_data_fonte",
                  "servidor": servidor,
                  "data_recebida": valor[:100] if isinstance(valor, str) else None,
                  "agora_utc": momento.astimezone(timezone.utc).isoformat(),
                  "idade_min_s": -300,
                  "idade_max_s": 30 * 86400,
              }

              motivo = "data_ausente"

              try:
                  if not isinstance(valor, str):
                      raise ValueError("Data da fonte ausente.")

                  motivo = "formato_invalido"
                  data = datetime.fromisoformat(valor.replace("Z", "+00:00"))

                  motivo = "data_sem_fuso"
                  if data.tzinfo is None:
                      raise ValueError("Data da fonte sem fuso horario.")

                  idade_s = (momento - data).total_seconds()
                  registro["data_fonte_utc"] = data.astimezone(
                      timezone.utc
                  ).isoformat()
                  registro["idade_s"] = idade_s
                  registro["idade_dias"] = round(idade_s / 86400, 4)

                  if idade_s < -300:
                      motivo = "data_no_futuro"
                      raise ValueError("Data da fonte fora do intervalo aceito.")

                  if idade_s > 30 * 86400:
                      motivo = "fonte_antiga"
                      raise ValueError("Data da fonte fora do intervalo aceito.")

              except (ValueError, TypeError, OverflowError) as erro:
                  registro.update({
                      "status": "rejeitada",
                      "motivo": motivo,
                      "erro": str(erro)[:180],
                  })
                  print(json.dumps(registro, ensure_ascii=False), flush=True)
                  raise

              registro["status"] = "aceita"
              print(json.dumps(registro, ensure_ascii=False), flush=True)
              return data, idade_s

          def consultar_overpass(comando, *argumentos, **opcoes):
              from datetime import datetime, timezone
              import time
              from email.utils import parsedate_to_datetime

              if not isinstance(comando, (list, tuple)) or comando.count(URL) != 1:
                  raise ValueError("Comando Overpass inesperado.")

              outro = "https://overpass.private.coffee/api/interpreter"
              if URL == outro:
                  outro = "https://overpass-api.de/api/interpreter"

              servidores = (URL, outro, URL)
              inicio = time.monotonic()
              opcoes = dict(opcoes)
              opcoes["timeout"] = 150
              opcoes["check"] = False

              def ajustar(argv, chave, valor):
                  if chave in argv:
                      argv[argv.index(chave) + 1] = valor
                  else:
                      argv[1:1] = [chave, valor]

              def encerrar(atual, erro_fonte):
                  if erro_fonte is not None:
                      relatorio["etapa"] = "validar_fonte"
                      raise ValueError(
                          "Resposta recebida, mas fonte rejeitada: " + erro_fonte
                      )
                  if atual is None:
                      raise TimeoutError("Tempo limite ao consultar Overpass.")
                  return atual

              for numero, servidor in enumerate(servidores, 1):
                  argv = [
                      servidor if item == URL else item
                      for item in comando
                  ]

                  cabecalho = pasta / f"http-tentativa-{numero}.headers"
                  temporario.unlink(missing_ok=True)

                  ajustar(argv, "--max-time", "120")
                  ajustar(argv, "--retry", "0")
                  ajustar(argv, "--dump-header", str(cabecalho))

                  atual = None
                  medidas = {}
                  codigo_curl = None
                  status_http = None
                  erro_fonte = None
                  fonte_valida = False

                  try:
                      atual = subprocess.run(argv, *argumentos, **opcoes)
                  except subprocess.TimeoutExpired:
                      pass
                  else:
                      codigo_curl = atual.returncode
                      try:
                          medidas = json.loads(atual.stdout or "{}")
                      except (ValueError, TypeError):
                          medidas = {}

                      if not isinstance(medidas, dict):
                          medidas = {}

                      valor = medidas.get(
                          "response_code",
                          medidas.get("http_code"),
                      )
                      try:
                          status_http = int(valor)
                      except (ValueError, TypeError):
                          status_http = None

                  retry_after = None
                  if cabecalho.is_file():
                      for linha in cabecalho.read_text(
                          encoding="utf-8",
                          errors="replace",
                      ).splitlines():
                          if linha.startswith("HTTP/"):
                              retry_after = None
                          elif linha.lower().startswith("retry-after:"):
                              retry_after = linha.split(":", 1)[1].strip()

                      cabecalho.unlink(missing_ok=True)

                  if codigo_curl == 0 and status_http == 200:
                      try:
                          if temporario.stat().st_size > LIMITE:
                              raise ValueError("Fonte excede o limite de tamanho.")

                          with temporario.open("rb") as arquivo:
                              candidato = json.load(
                                  arquivo,
                                  parse_constant=rejeitar_constante,
                              )

                          if not isinstance(candidato, dict) or candidato.get("remark"):
                              raise ValueError("Resposta Overpass incompleta.")

                          validar_data_fonte(candidato, servidor=servidor)
                      except (OSError, ValueError, TypeError, OverflowError) as erro:
                          erro_fonte = str(erro)[:180]
                      else:
                          fonte_valida = True

                  registro = {
                      "etapa": "consultar_overpass",
                      "tentativa": numero,
                      "servidor": servidor,
                      "codigo_curl": codigo_curl,
                      "status_http": status_http,
                      "duracao_s": medidas.get("time_total"),
                      "retry_after": retry_after,
                      "data_validada": fonte_valida,
                  }

                  if erro_fonte is not None:
                      registro["erro_validacao"] = erro_fonte

                  if not fonte_valida:
                      try:
                          with temporario.open("rb") as arquivo:
                              registro["corpo_inicio"] = arquivo.read(500).decode(
                                  "utf-8",
                                  errors="replace",
                              )
                      except OSError:
                          pass

                  relatorio.update({
                      "servidor": servidor,
                      "tentativas_realizadas": numero,
                      "codigo_curl": codigo_curl,
                      "status_http": status_http,
                      "verificacao_tls": medidas.get("ssl_verify_result"),
                      "duracao_s": medidas.get("time_total"),
                  })

                  print(json.dumps(registro, ensure_ascii=False), flush=True)

                  if fonte_valida:
                      return atual

                  recuperavel = (
                      atual is None
                      or codigo_curl in {5, 6, 7, 18, 28, 52, 55, 56, 92}
                      or status_http in {408, 429, 500, 502, 503, 504}
                      or erro_fonte is not None
                  )

                  if not recuperavel or numero == len(servidores):
                      return encerrar(atual, erro_fonte)

                  espera = 30 * (2 ** (numero - 1))

                  if retry_after:
                      try:
                          segundos = int(retry_after)
                      except ValueError:
                          try:
                              momento = parsedate_to_datetime(retry_after)
                              if momento.tzinfo is None:
                                  momento = momento.replace(tzinfo=timezone.utc)
                              segundos = (
                                  momento - datetime.now(timezone.utc)
                              ).total_seconds()
                          except (ValueError, TypeError, OverflowError):
                              segundos = 0

                      espera = max(espera, segundos)

                  excedeu_orcamento = (
                      time.monotonic() - inicio + espera + 150 > 600
                  )

                  if espera > 60 or excedeu_orcamento:
                      print(json.dumps({
                          "status": "interrompido",
                          "motivo": "espera_ou_tempo_total_excedido",
                          "espera_exigida_s": espera,
                      }), flush=True)
                      return encerrar(atual, erro_fonte)

                  print(json.dumps({
                      "status": "aguardando",
                      "proxima_tentativa": numero + 1,
                      "espera_s": espera,
                  }), flush=True)

                  time.sleep(espera)

          try:
              execucao = consultar_overpass(
                  [
                      "curl", "--silent", "--show-error",
                      "--proto", "=https",
                      "--connect-timeout", "15",
                      "--max-time", "180",
                      "--max-filesize", str(LIMITE),
                      "--retry", "0",
                      "--header", "Accept: application/json",
                      "--user-agent",
                      "LitroDeOuro/1.1 (contact: litrodeourooficial@gmail.com)",
                      "--data-urlencode", "data=" + CONSULTA,
                      "--output", str(temporario),
                      "--write-out", "%{json}",
                      URL,
                  ],
                  capture_output=True,
                  text=True,
                  timeout=190,
                  check=False,
              )

              info = json.loads(
                  execucao.stdout or "{}",
                  parse_constant=rejeitar_constante,
              )
              if not isinstance(info, dict):
                  raise ValueError("Metricas HTTP invalidas.")

              valor_http = info.get("response_code", info.get("http_code"))
              try:
                  status_http = int(valor_http)
              except (ValueError, TypeError):
                  status_http = None

              relatorio.update(
                  codigo_curl=execucao.returncode,
                  status_http=status_http,
                  verificacao_tls=info.get("ssl_verify_result"),
                  duracao_s=info.get("time_total"),
              )

              if execucao.returncode != 0 or status_http != 200:
                  raise ValueError("Consulta HTTP nao concluida com sucesso.")

              relatorio["etapa"] = "validar_fonte"
              bruto = temporario.read_bytes()

              if not bruto or len(bruto) > LIMITE:
                  raise ValueError("Fonte vazia ou acima do limite.")

              corpo = json.loads(bruto, parse_constant=rejeitar_constante)

              if not isinstance(corpo, dict) or corpo.get("remark"):
                  raise ValueError("Resposta Overpass incompleta.")

              elementos = corpo.get("elements")
              if not isinstance(elementos, list) or not 2 <= len(elementos) <= 5000:
                  raise ValueError("Quantidade de elementos incompativel.")

              if not all(isinstance(item, dict) for item in elementos):
                  raise ValueError("Elemento OSM invalido.")

              areas = [
                  item for item in elementos
                  if item.get("type") == "area"
              ]
              if len(areas) != 1:
                  raise ValueError("Area administrativa ausente ou ambigua.")

              tags = areas[0].get("tags")
              if (
                  not isinstance(tags, dict)
                  or tags.get("boundary") != "administrative"
                  or tags.get("admin_level") != "8"
                  or tags.get("IBGE:GEOCODIGO") != "2507507"
              ):
                  raise ValueError("Consulta fora do municipio esperado.")

              locais = [
                  item for item in elementos
                  if item.get("type") != "area"
              ]

              for item in locais:
                  centro = (
                      item if item.get("type") == "node"
                      else item.get("center")
                  )
                  tags = item.get("tags")

                  if (
                      item.get("type") not in {"node", "way", "relation"}
                      or not isinstance(item.get("id"), int)
                      or item["id"] <= 0
                      or not isinstance(tags, dict)
                      or tags.get("amenity") not in {"fuel", "charging_station"}
                      or not isinstance(centro, dict)
                      or not isinstance(centro.get("lat"), (int, float))
                      or not isinstance(centro.get("lon"), (int, float))
                      or not -7.25 <= centro["lat"] <= -6.95
                      or not -35.0 <= centro["lon"] <= -34.7
                  ):
                      raise ValueError("Local fora da consulta esperada.")

              data, idade_s = validar_data_fonte(
                  corpo,
                  servidor=relatorio["servidor"],
              )

              relatorio["etapa"] = "arquivar_fonte"

              with (pasta / "fonte.json").open("xb") as arquivo:
                  arquivo.write(bruto)

              sha256_fonte = hashlib.sha256(bruto).hexdigest()
              manifesto = {"arquivos": {"fonte.json": sha256_fonte}}

              with (pasta / "manifesto.json").open("x", encoding="utf-8") as arquivo:
                  json.dump(manifesto, arquivo, ensure_ascii=False, indent=2)

              relatorio.update(
                  status="ok",
                  etapa="concluido",
                  consulta_municipal_validada=True,
                  elementos_locais=len(locais),
                  data_base_fonte_utc=data.astimezone(timezone.utc).isoformat(),
                  sha256_fonte=sha256_fonte,
              )

              saida_github = os.environ.get("GITHUB_OUTPUT")
              if saida_github:
                  with Path(saida_github).open("a", encoding="utf-8") as arquivo:
                      arquivo.write("sha256_fonte=" + sha256_fonte + "\n")

              codigo = 0

          except Exception as erro:
              relatorio.update(
                  status="falha",
                  tipo_erro=type(erro).__name__,
              )
              if isinstance(erro, ValueError):
                  relatorio["erro"] = str(erro)[:200]

          finally:
              temporario.unlink(missing_ok=True)
              with (pasta / "relatorio.json").open("x", encoding="utf-8") as arquivo:
                  json.dump(relatorio, arquivo, ensure_ascii=False, indent=2)
              print(json.dumps(relatorio, ensure_ascii=False, indent=2), flush=True)

          sys.exit(codigo)

      - name: Guardar fonte e relatorio
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: osm-fonte-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            relatorios/osm-fonte/fonte.json
            relatorios/osm-fonte/manifesto.json
            relatorios/osm-fonte/relatorio.json
          if-no-files-found: warn
          retention-days: 30