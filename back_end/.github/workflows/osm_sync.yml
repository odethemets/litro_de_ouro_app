name: Importar postos OSM - Joao Pessoa

on:
  schedule:
    # Segunda-feira, 06:17 em João Pessoa (09:17 UTC).
    - cron: '17 9 * * 1'

  workflow_dispatch:
    inputs:
      aplicar:
        description: 'Gravar somente postos novos com nome?'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: osm-sync-joao-pessoa
  cancel-in-progress: false

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: back_end

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: back_end/requirements-osm.txt

      - name: Instalar dependencias do importador
        run: python -m pip install -r requirements-osm.txt

      - name: Preparar certificado Aiven
        env:
          AIVEN_CA_PEM: ${{ secrets.AIVEN_CA_PEM }}
        shell: python
        run: |
          import os
          from pathlib import Path

          certificado = os.getenv('AIVEN_CA_PEM', '').strip()

          if certificado:
              caminho = Path(os.environ['RUNNER_TEMP']) / 'litro-aiven-ca.pem'
              caminho.write_text(certificado + '\n', encoding='utf-8')

              with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as arquivo:
                  arquivo.write(f'DB_SSL_CA={caminho}\n')

      - name: Consultar e processar catalogo municipal
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_PORT: ${{ vars.OSM_DB_PORT || '26841' }}
          DB_USER: ${{ secrets.DB_USER || 'avnadmin' }}
          DB_NAME: ${{ vars.OSM_DB_NAME || 'defaultdb' }}
          OSM_OVERPASS_URLS: ${{ vars.OSM_OVERPASS_URLS }}
          OSM_USER_AGENT: 'LitroDeOuro/1.1 (+https://github.com/odethemets/litro_de_ouro_app)'
          EVENTO: ${{ github.event_name }}
          APLICAR_MANUAL: ${{ inputs.aplicar }}
          APLICAR_AGENDADO: ${{ vars.OSM_SYNC_APPLY }}
        shell: python
        run: |
          import os
          import subprocess
          import sys

          evento = os.getenv('EVENTO')

          aplicar = (
              evento == 'workflow_dispatch'
              and os.getenv('APLICAR_MANUAL') == 'true'
          ) or (
              evento == 'schedule'
              and os.getenv('APLICAR_AGENDADO') == 'true'
          )

          argumentos = [
              sys.executable,
              'scripts/importar_postos_osm.py',
              '--joao-pessoa',
              '--tentativas',
              '2',
              '--relatorio',
              'relatorios/osm_sync.json',
              '--salvar-json',
              'relatorios/osm_fonte.json',
              '--aplicar' if aplicar else '--dry-run',
          ]

          resultado = subprocess.run(argumentos, check=False)
          sys.exit(resultado.returncode)

      - name: Guardar relatorios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: osm-sync-${{ github.run_id }}-${{ github.run_attempt }}
          path: back_end/relatorios/*.json
          if-no-files-found: warn
          retention-days: 30