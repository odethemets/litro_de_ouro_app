name: Diagnostico Overpass - sem banco

on:
  workflow_dispatch:
    inputs:
      servidor:
        description: 'Servidor publico para testar'
        required: true
        type: choice
        default: 'https://overpass-api.de/api/interpreter'
        options:
          - 'https://overpass-api.de/api/interpreter'
          - 'https://overpass.private.coffee/api/interpreter'

permissions: {}

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Testar uma consulta minima
        env:
          OVERPASS_TEST_URL: ${{ inputs.servidor }}
        shell: python
        run: |
          import json
          import os
          import sys
          from urllib.error import HTTPError
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          permitidos = {
              'https://overpass-api.de/api/interpreter',
              'https://overpass.private.coffee/api/interpreter',
          }

          url = os.environ.get('OVERPASS_TEST_URL', '')

          if url not in permitidos:
              raise SystemExit('Servidor nao permitido.')

          requisicao = Request(
              url,
              data=urlencode({
                  'data': '[out:json][timeout:5];node(1);out ids;',
              }).encode('utf-8'),
              headers={
                  'Content-Type': 'application/x-www-form-urlencoded',
                  'Accept': 'application/json',
                  'User-Agent': 'LitroDeOuro/1.1 (+https://github.com/odethemets/litro_de_ouro_app)',
              },
              method='POST',
          )

          resultado = {
              'servidor': url,
              'mysql_consultado': False,
          }
          codigo = 0

          try:
              with urlopen(requisicao, timeout=20) as resposta:
                  resultado['status_http'] = resposta.status
                  bruto = resposta.read(1024 * 1024 + 1)

              if len(bruto) > 1024 * 1024:
                  raise ValueError('Resposta maior que o limite.')

              corpo = json.loads(bruto)

              if (
                  not isinstance(corpo, dict)
                  or corpo.get('remark')
                  or not isinstance(corpo.get('elements'), list)
              ):
                  raise ValueError('Resposta Overpass incompleta.')

              resultado.update(
                  status='ok',
                  total_elementos=len(corpo['elements']),
              )

          except HTTPError as erro:
              resultado.update(
                  status='falha_http',
                  status_http=erro.code,
                  retry_after=(
                      erro.headers.get('Retry-After')
                      if erro.headers
                      else None
                  ),
              )
              erro.close()
              codigo = 1

          except Exception as erro:
              resultado.update(
                  status='falha',
                  tipo_erro=type(erro).__name__,
              )
              codigo = 1

          print(json.dumps(
              resultado,
              ensure_ascii=False,
              indent=2,
          ))

          sys.exit(codigo)